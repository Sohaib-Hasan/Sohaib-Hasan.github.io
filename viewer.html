<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Viewing Notes — Sohaib Hasan</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{overflow:hidden;}
  .viewer-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 1rem clamp(1.2rem, 4vw, 2.5rem);
    border-bottom:1px solid var(--line);
  }
  .viewer-title{font-family:'Fraunces', serif; font-size:1rem; font-weight:500;}
  .viewer-note{
    font-family:'JetBrains Mono', monospace; font-size:0.68rem; color:var(--chalk-faint);
  }
  .viewer-frame-wrap{
    position:relative; width:100%; height:calc(100svh - 62px); background:var(--board-deep);
  }
  .viewer-frame-wrap iframe{
    width:100%; height:100%; border:none; display:block;
  }
  /* transparent shield strip over the top of the iframe to block the native toolbar's
     download/print icons in browsers that still render them despite #toolbar=0 */
  .shield{
    position:absolute; top:0; left:0; right:0; height:40px;
    background:transparent; z-index:5;
  }
</style>
</head>
<body>

<header class="viewer-header">
  <div>
    <div class="viewer-title" id="titleText">Loading…</div>
    <div class="viewer-note">View only — right-click, printing, and saving are disabled</div>
  </div>
  <a class="back-link" href="notes.html" style="margin:0;">← Back to Notes</a>
</header>

<div class="viewer-frame-wrap">
  <div class="shield" oncontextmenu="return false;"></div>
  <iframe id="pdfFrame" oncontextmenu="return false;"></iframe>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get('file');
  const title = params.get('title') || 'Notes';

  document.getElementById('pageTitle').textContent = title + ' — Sohaib Hasan';
  document.getElementById('titleText').textContent = title;

  if (file) {
    document.getElementById('pdfFrame').src = file + '#toolbar=0&navpanes=0&scrollbar=1';
  }

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'p')) {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
