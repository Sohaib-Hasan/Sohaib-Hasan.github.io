<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Viewing Notes — Sohaib Hasan</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ -webkit-user-select:none; user-select:none; }
  .viewer-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 1rem clamp(1.2rem, 4vw, 2.5rem);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--board); z-index:10;
  }
  .viewer-title{font-family:'Fraunces', serif; font-size:1rem; font-weight:500;}
  .viewer-note{
    font-family:'JetBrains Mono', monospace; font-size:0.68rem; color:var(--chalk-faint);
  }
  .pages-wrap{
    display:flex; flex-direction:column; align-items:center; gap:1.2rem;
    padding: 1.6rem clamp(1rem, 4vw, 2rem) 4rem;
    background:var(--board-deep);
    min-height:calc(100svh - 62px);
  }
  canvas.pdf-page{
    max-width:100%; height:auto; display:block;
    box-shadow:0 10px 34px rgba(0,0,0,0.5);
    border-radius:2px;
    pointer-events:none; /* blocks drag-to-save gestures on the rendered image */
  }
  #loadingMsg{
    color:var(--chalk-faint); font-family:'JetBrains Mono', monospace;
    font-size:0.8rem; padding:3rem 1rem; text-align:center;
  }
</style>
</head>
<body>

<header class="viewer-header">
  <div>
    <div class="viewer-title" id="titleText">Loading…</div>
    <div class="viewer-note">View only — right-click, selecting, and saving are disabled</div>
  </div>
  <a class="back-link" href="notes.html" style="margin:0;">← Back to Notes</a>
</header>

<div class="pages-wrap" id="pagesContainer">
  <div id="loadingMsg">Loading document…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const params = new URLSearchParams(window.location.search);
  const file = params.get('file');
  const title = params.get('title') || 'Notes';

  document.getElementById('pageTitle').textContent = title + ' — Sohaib Hasan';
  document.getElementById('titleText').textContent = title;

  const container = document.getElementById('pagesContainer');
  const loadingMsg = document.getElementById('loadingMsg');

  async function renderPDF(url) {
    const pdf = await pdfjsLib.getDocument(url).promise;
    loadingMsg.remove();
    const targetWidth = Math.min(window.innerWidth * 0.9, 900);
    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = (targetWidth / baseViewport.width) * 2; // 2x for sharpness
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.className = 'pdf-page';
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = (viewport.width / 2) + 'px';
      container.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
    }
  }

  if (file) {
    renderPDF(file).catch(err => {
      loadingMsg.textContent = 'Could not load the document.';
      console.error(err);
    });
  } else {
    loadingMsg.textContent = 'No document specified.';
  }

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'p' || k === 'u' || k === 'c')) {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
