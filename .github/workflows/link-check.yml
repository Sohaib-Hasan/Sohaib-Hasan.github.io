name: Link Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose --no-progress
            --exclude-mail
            --exclude "linkedin\.com"
            --exclude "instagram\.com"
            --exclude "web\.facebook\.com"
            --exclude "drive\.google\.com"
            --exclude "^tel:"
            --exclude "gumroad\.com"
            './**/*.html'
          fail: true
